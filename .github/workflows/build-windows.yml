name: Build AuraCode for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit legacy branding and telemetry references
        shell: bash
        run: |
          set -euo pipefail
          legacy=$(printf '\\153\\151\\154\\157')
          git grep -nIi -E "$legacy" -- . > /tmp/legacy.txt || true
          git grep -nIi -E 'telemetry|posthog|sentry|opentelemetry|OTEL_|amplitude|mixpanel|statsig' -- . > /tmp/telemetry.txt || true
          echo "LEGACY_MATCH_COUNT=$(wc -l < /tmp/legacy.txt)"
          echo "LEGACY_FILE_COUNT=$(cut -d: -f1 /tmp/legacy.txt | sort -u | wc -l)"
          echo "Legacy branding paths and excerpts (up to 350):"
          head -n 350 /tmp/legacy.txt
          echo "TELEMETRY_MATCH_COUNT=$(wc -l < /tmp/telemetry.txt)"
          echo "TELEMETRY_FILE_COUNT=$(cut -d: -f1 /tmp/telemetry.txt | sort -u | wc -l)"
          echo "Telemetry paths:"
          cut -d: -f1 /tmp/telemetry.txt | sort -u | head -n 350
          echo "Runtime telemetry reference excerpts:"
          grep -Ei 'capture|posthog|sentry|transmit|upload|OTEL|tracking|collector|sdk|client|network' /tmp/telemetry.txt | head -n 200 || true
  vsix:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      AURA_VERSION: 1.0.1
      AURA_CHANNEL: latest
      AURA_RELEASE: "true"
      AURA_TELEMETRY_LEVEL: "off"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies and refresh the renamed workspace lockfile
        run: bun install
      - name: Verify the local-only boundary
        run: node --experimental-strip-types --test packages/local-only/test/policy.test.ts
      - name: Verify telemetry stays disabled
        run: node --experimental-transform-types --test packages/aura-telemetry/src/__tests__/privacy.test.ts
      - name: Verify custom provider forms and authenticated model discovery
        working-directory: packages/aura-vscode
        run: bun test tests/unit/local-custom-provider.test.ts
      - name: Regenerate the SDK
        working-directory: packages/aura-vscode
        run: bun run prepare:sdk
      - name: Type check backend
        working-directory: packages/opencode
        run: bun run typecheck
      - name: Type check and lint extension
        working-directory: packages/aura-vscode
        run: |
          bun run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run lint
      - name: Compile native Windows backend and bundle extension
        working-directory: packages/aura-vscode
        run: |
          bun script/local-bin.ts --compiled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run bundle:production
      - name: Package VSIX
        working-directory: packages/aura-vscode
        run: bunx vsce package --no-dependencies --target win32-x64 --out ../../auracode-1.0.1-win32-x64.vsix
      - name: Exercise compiled local streaming inference
        run: node script/smoke-local-agent.mjs packages/aura-vscode/bin/aura.exe
      - name: Audit packaged branding
        run: node script/audit-vsix.mjs auracode-1.0.1-win32-x64.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: auracode-1.0.1-win32-x64
          path: auracode-1.0.1-win32-x64.vsix
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auracode-dependency-lock
          path: bun.lock
          if-no-files-found: ignore
