name: Publish verified AuraCode VSIX
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: auracode-1.0.1-win32-x64
          run-id: 41494206998
          github-token: ${{ github.token }}
          path: verified
      - name: Verify the audited package and publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '773a44ce34582c66a35b1acfc9435c6c0a2bb229bdae8fb88fb073ef4eee6ad2  verified/auracode-1.0.1-win32-x64.vsix' | sha256sum --check
          cat > notes.md <<'EOF'
          Windows x64 VS Code extension. Requires VS Code 1.105.1 or newer.

          Restore the full Custom provider editor: provider ID and name, API key or environment reference, custom headers, model discovery, multiple models, reasoning and image capabilities, editing, enabling, disabling and deletion. OpenAI Compatible, OpenAI Responses and Anthropic Messages protocols are available for local servers.

          Configure your local OpenAI-compatible server in Settings → Providers. Only 127.0.0.1, localhost and [::1] endpoints are accepted; HTTP redirects are refused. Use the exact model ID exposed by your server.

          Event telemetry and cloud session uploads are disabled. Cloud model providers and external plugins cannot be enabled through project configuration. Mandatory MIT attribution is preserved in the packaged license.

          Validation: backend and extension type checks, ESLint, native Windows compilation, local HTTP/redirect tests, custom form and authenticated model discovery tests, disabled telemetry tests, compiled agent streaming inference with a stored API key and custom header against a loopback test server, and archive branding audit passed. Installation in the user's VS Code and inference with the user's own model remain to be checked.

          Source: 9cd2bad8b9b165e0d132f850598153098331d61c
          SHA256: 773a44ce34582c66a35b1acfc9435c6c0a2bb229bdae8fb88fb073ef4eee6ad2
          EOF
          gh release create v1.0.1 verified/auracode-1.0.1-win32-x64.vsix --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'AuraCode 1.0.1 — Windows x64' --notes-file notes.md
