name: Publish verified AuraCode VSIX
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-vsix.yml
permissions:
  actions: read
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the successful Windows build
        uses: actions/download-artifact@v4
        with:
          name: auracode-1.0.1-win32-x64
          run-id: 41504004367
          github-token: ${{ github.token }}
          path: verified
      - name: Verify and publish the updated icons release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo 'a6379276a8ae3c413e9b148b7462a5381582005aaf61e513e82fb3fa5f556147  verified/auracode-1.0.1-win32-x64.vsix' | sha256sum --check
          if gh release view v1.0.1-icons --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v1.0.1-icons is already published; not overwriting assets.'
            exit 0
          fi
          cat > notes.md <<'EOF'
          AuraCode 1.0.1 for Windows x64 — updated branding and icons.

          This is a branded rebuild of version 1.0.1, published as a separate release to preserve the original v1.0.1 package and its audited checksum.

          - New full-color icon for Marketplace and the Welcome to Aura screen.
          - Simplified light and dark SVG artwork for VS Code Activity Bar.
          - Fix the SolidJS SVG type-check error from the previous build.
          - Local AI provider support and privacy restrictions remain unchanged.

          Requires VS Code 1.105.1 or newer on Windows x64.
          Validation: Windows packaging, backend/extension type checks, ESLint, local inference smoke test and packaged branding audit passed.
          Installation and display of icons in the user's VS Code are not yet tested.

          Source commit: 5763bf3309823bfe3c24953d166720b51f070056
          Build run: 41504004367
          SHA256: a6379276a8ae3c413e9b148b7462a5381582005aaf61e513e82fb3fa5f556147
          EOF
          gh release create v1.0.1-icons verified/auracode-1.0.1-win32-x64.vsix \
            --repo "$GITHUB_REPOSITORY" \
            --target 5763bf3309823bfe3c24953d166720b51f070056 \
            --title 'AuraCode 1.0.1 — Updated Icons (Windows x64)' \
            --notes-file notes.md
