name: Publish verified AuraCode VSIX
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: auracode-1.0.0-win32-x64
          run-id: 41485344570
          github-token: ${{ github.token }}
          path: verified
      - name: Verify the audited package and publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '9a5073c70ce42a98a3f224d8da63f3b50e2b8897cc46ca381622f7e052184f84  verified/auracode-1.0.0-win32-x64.vsix' | sha256sum --check
          cat > notes.md <<'EOF'
          Windows x64 VS Code extension. Requires VS Code 1.105.1 or newer.

          Configure your local OpenAI-compatible server in Settings → Providers. Only 127.0.0.1, localhost and [::1] endpoints are accepted; HTTP redirects are refused. Use the exact model ID exposed by your server.

          Event telemetry and cloud session uploads are disabled. Cloud model providers and external plugins cannot be enabled through project configuration. Mandatory MIT attribution is preserved in the packaged license.

          Validation: backend and extension type checks, ESLint, native Windows compilation, local HTTP/redirect tests, disabled telemetry tests, compiled agent streaming inference against a loopback test server, and archive branding audit passed. Installation in the user's VS Code and inference with the user's own model remain to be checked.

          Source: 72adc596f869c10181bea3d49f53671166b63bee
          SHA256: 9a5073c70ce42a98a3f224d8da63f3b50e2b8897cc46ca381622f7e052184f84
          EOF
          gh release create v1.0.0 verified/auracode-1.0.0-win32-x64.vsix --repo "$GITHUB_REPOSITORY" --target 72adc596f869c10181bea3d49f53671166b63bee --title 'AuraCode 1.0.0 — Windows x64' --notes-file notes.md
