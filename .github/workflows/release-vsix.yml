name: Publish AuraCode 1.0.2 VSIX
on:
  workflow_run:
    workflows: ["Build AuraCode for Windows"]
    types: [completed]
permissions:
  actions: read
  contents: write
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == 'a86b6b25e898953e6cd39bdc472632fd12a2c4cd' && github.event.workflow_run.head_repository.full_name == 'rmnrf/AuraCode'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download audited Windows 1.0.2 package
        uses: actions/download-artifact@v4
        with:
          name: auracode-1.0.2-win32-x64
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: verified
      - name: Verify package identity and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          file="verified/auracode-1.0.2-win32-x64.vsix"
          test -s "$file"
          version=$(unzip -p "$file" extension/package.json | node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync(0,'utf8'));if(p.name!=='aura-code') process.exit(2);console.log(p.version)")
          if [ "$version" != "1.0.2" ]; then echo "Unexpected VSIX version: $version"; exit 1; fi
          sha=$(sha256sum "$file" | awk '{print $1}')
          echo "Verified AuraCode $version SHA256: $sha"
          if gh release view v1.0.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.2 already exists; no assets overwritten."
            exit 0
          fi
          cat > notes.md <<EOF
          AuraCode 1.0.2 — Windows x64 VS Code extension.

          Changes:
          - Custom providers now accept explicitly configured HTTPS servers and HTTP servers on private LAN addresses as well as localhost.
          - Fetch Models accepts the user's configured Base URL, API key and custom headers.
          - The backend model adapter uses the same saved custom provider endpoint.
          - API keys are sent only to the selected endpoint; HTTP redirects remain blocked.
          - Updated AuraCode branding and icons are included.
          - Known application event telemetry transports remain disabled.

          Requirements: Windows x64 and VS Code 1.105.1 or newer.
          Security: When configuring an external model service, your prompts and API key are sent to that selected service. Only connect to servers you trust.

          CI validation: local policy tests, custom provider discovery tests, disabled telemetry test, backend and extension type checks, ESLint, native Windows build, compiled local inference smoke test and VSIX branding audit.
          Live usage with your own remote provider is not yet tested.

          Source commit: $SOURCE_SHA
          Build run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID
          SHA256: $sha
          EOF
          gh release create v1.0.2 "$file" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "AuraCode 1.0.2 — Windows x64" --notes-file notes.md --latest
